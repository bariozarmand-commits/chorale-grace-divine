<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Admin Chorale</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'git-gateway',
          branch: 'main'
        },
        media_folder: 'static/img',
        public_folder: '/img',
        collections: [
          {
            name: 'chants',
            label: 'Chants',
            folder: 'content/chants',
            create: true,
            fields: [
              {label: 'Titre', name: 'title', widget: 'string'},
              {label: 'Paroles', name: 'body', widget: 'markdown'}
            ]
          }
        ]
      }
    })
  </script>
</body>
</html>
